<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DinoRenny SUE COLOR TAP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  /* Full-bleed stage: bg color + image filtered together so hue shift is seamless */
  .stage {
    position: fixed; inset: -24px;            /* bleed so boiled edges stay offscreen */
    background: #F2EDE2;
    filter: url(#boil);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .dino {
    width: min(78vmin, 560px);
    filter: hue-rotate(var(--hue, 0deg)) saturate(var(--sat, 1)) brightness(var(--bri, 1)) drop-shadow(0 14px 0 rgba(17,17,17,.12));
    transition: filter .25s ease;
    transform-origin: 50% 60%;
  }
  .dino.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop {
    0%   { transform: scale(1) rotate(0deg); }
    30%  { transform: scale(1.14) rotate(-5deg); }
    60%  { transform: scale(.96) rotate(4deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  /* UI layer sits above the filtered stage, unaffected by hue */
  .ui { position: fixed; inset: 0; pointer-events: none;
        display: flex; flex-direction: column; align-items: center;
        justify-content: space-between; padding: 28px 16px; }
  .name {
    font-size: clamp(20px, 4.5vmin, 32px); font-weight: 800;
    letter-spacing: .14em; color: #111;
    text-shadow: 3px 3px 0 rgba(255,233,74,.9);
    opacity: 0; transform: translateY(8px) scale(.9);
  }
  .name.show { animation: flash 1.1s ease forwards; }
  @keyframes flash {
    0% { opacity: 0; transform: translateY(8px) scale(.9); }
    15% { opacity: 1; transform: translateY(0) scale(1.06); }
    25% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .hint {
    font-size: clamp(14px, 3vmin, 18px); font-weight: 700;
    letter-spacing: .2em; color: #111;
    background: #fff; border: 3px solid #111; border-radius: 999px;
    padding: 10px 22px; box-shadow: 4px 4px 0 #111;
    animation: bob 1.4s ease-in-out infinite;
    transition: opacity .4s;
  }
  .hint.hide { opacity: 0; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .buy {
    pointer-events: auto;
    font-size: clamp(15px, 3.4vmin, 20px); font-weight: 800;
    letter-spacing: .08em; color: #fff; text-decoration: none;
    background: #111; border: 3px solid #111; border-radius: 999px;
    padding: 14px 30px; box-shadow: 5px 5px 0 rgba(17,17,17,.25);
    transition: transform .15s ease;
  }
  .buy:active { transform: scale(.96); }
  @media (prefers-reduced-motion: reduce) {
    .hint { animation: none; }
    .dino.pop { animation: none; }
  }
</style>
</head>
<body>

<!-- SVG line-boil filter: discrete seed steps = hand-drawn frame wobble -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="1" result="n">
      <animate attributeName="seed" values="1;2;3;4;5;6;7;8" dur="0.8s"
               repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="14"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

  // ===== SHOP設定:Shopifyで商品を作成後、ここを書き換える =====

    dino.classList.remove("pop"); void dino.offsetWidth; dino.classList.add("pop");
    const vid = SHOP.variants[p.name];
    buyEl.href = vid ? SHOP.productUrl + "?variant=" + vid : SHOP.productUrl;
    buyEl.textContent = "🛒 " + p.name + " のアクキーを購入";
    if (navigator.vibrate) navigator.vibrate(20);
  });
</script>
